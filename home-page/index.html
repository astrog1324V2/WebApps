<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nathan's App Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.72);
      --line: rgba(148, 163, 184, 0.25);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f97316;
      --accent-2: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(249, 115, 22, 0.24), transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(34, 197, 94, 0.2), transparent 36%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(8px);
      box-shadow: 0 24px 70px rgba(2, 6, 23, 0.5);
      overflow: hidden;
    }

    .hero {
      padding: 28px 28px 12px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      padding: 22px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.5);
      display: grid;
      gap: 10px;
    }

    .tag {
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .app-name {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 700;
    }

    .url {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      word-break: break-all;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #fb923c);
      color: #111827;
      padding: 9px 12px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }

    .btn.alt {
      background: linear-gradient(135deg, var(--accent-2), #4ade80);
    }

    .footer {
      padding: 0 22px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1 id="hub-title">Nathan's App Library</h1>
      <p id="hub-subtitle" class="subtitle">Single homepage for all web apps running in Docker.</p>
    </section>

    <section id="app-grid" class="grid"></section>

    <section class="footer">
      This page is generated from the shared app registry. On LAN it links to local ports; through Cloudflare it can switch to matching subdomains automatically.
    </section>
  </main>

  <script>
    const appGrid = document.getElementById("app-grid");
    const hubTitle = document.getElementById("hub-title");
    const hubSubtitle = document.getElementById("hub-subtitle");
    const host = window.location.hostname || "localhost";
    const protocol = window.location.protocol === "https:" ? "https:" : "http:";

    const makeUrl = (port) => `${protocol}//${host}:${port}`;
    const isPrivateIpv4 = (value) => {
      const match = value.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
      if (!match) {
        return false;
      }

      const first = Number(match[1]);
      const second = Number(match[2]);
      return (
        first === 10 ||
        first === 127 ||
        (first === 192 && second === 168) ||
        (first === 172 && second >= 16 && second <= 31)
      );
    };

    const isProbablyLocalHost = (value) => {
      if (!value) {
        return true;
      }
      if (value === "localhost" || value === "::1" || value === "[::1]") {
        return true;
      }
      if (isPrivateIpv4(value)) {
        return true;
      }
      if (value.endsWith(".local") || value.endsWith(".lan") || value.endsWith(".home.arpa")) {
        return true;
      }
      return !value.includes(".");
    };

    const makePublicUrl = (subdomain) => {
      if (!subdomain) {
        return null;
      }

      const parts = host.split(".");
      if (parts.length < 3) {
        return null;
      }

      return `${protocol}//${subdomain}.${parts.slice(1).join(".")}`;
    };

    const resolveAppUrl = (app) => {
      if (isProbablyLocalHost(host)) {
        return makeUrl(app.port);
      }

      return makePublicUrl(app.publicSubdomain) || makeUrl(app.port);
    };

    const renderAppCard = (app) => {
      const article = document.createElement("article");
      article.className = "card";

      const buttonClass = app.buttonVariant === "alt" ? "btn alt" : "btn";
      const appUrl = resolveAppUrl(app);

      article.innerHTML = `
        <div class="tag">${app.tag}</div>
        <h2 class="app-name">${app.name}</h2>
        <p class="url">${appUrl}</p>
        <p class="url">${app.description}</p>
        <a class="${buttonClass}" href="${appUrl}">Open App</a>
      `;

      return article;
    };

    fetch("./apps.json")
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Failed to load app list (${response.status})`);
        }
        return response.json();
      })
      .then((payload) => {
        if (payload.hub?.title) {
          hubTitle.textContent = payload.hub.title;
        }
        if (payload.hub?.subtitle) {
          hubSubtitle.textContent = payload.hub.subtitle;
        }

        appGrid.innerHTML = "";
        (payload.apps || []).forEach((app) => {
          appGrid.appendChild(renderAppCard(app));
        });
      })
      .catch((error) => {
        appGrid.innerHTML = `
          <article class="card">
            <div class="tag">Configuration Error</div>
            <h2 class="app-name">App list unavailable</h2>
            <p class="url">${error.message}</p>
          </article>
        `;
      });
  </script>
</body>
</html>
